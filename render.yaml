services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_ACCESS_MODE
        value: public
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: LINKEDIN_ADDITIONAL_COOKIES
        sync: false
      - key: READINESS_KEY
        sync: false
      - key: READINESS_CACHE_TTL_SECONDS
        value: "300"
      - key: READINESS_TIMEOUT_MS
        value: "5000"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SESSION_ALERT_EMAIL_TO
        sync: false
      - key: SESSION_ALERT_COOLDOWN_SECONDS
        value: "3600"
      - key: SERVICE_PUBLIC_URL
        sync: false
      - key: SCRAPE_CONCURRENCY
        value: "1"
      - key: REQUESTS_PER_MINUTE
        value: "2"
