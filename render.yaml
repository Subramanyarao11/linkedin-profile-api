services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_ACCESS_MODE
        value: public
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: INCLUDE_DETAIL_PAGES
        value: "true"
      - key: SCRAPE_CONCURRENCY
        value: "1"
      - key: REQUESTS_PER_MINUTE
        value: "2"
